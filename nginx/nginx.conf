events {}

http {

    upstream auth_service {
        server auth-service:8000;
    }

    upstream user_service {
        server user-service:8000;
    }

    upstream complaint_service {
        server complaint-service:8000;
    }

    upstream assignment_service {
        server assignment-service:8000;
    }

    upstream notification_service {
        server notification-service:8000;
    }

    server {

        listen 80;

        location /auth/ {
            proxy_pass http://auth_service/;
        }

        location /users/ {
            proxy_pass http://user_service/;
        }

        location /complaints/ {
            proxy_pass http://complaint_service/;
        }

        location /assignments/ {
            proxy_pass http://assignment_service/;
        }

        location /notifications/ {
            proxy_pass http://notification_service/;
        }
    }
}