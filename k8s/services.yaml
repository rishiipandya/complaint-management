apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: complaint-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: riship2003/complaint-auth:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: complaint_management
            - name: DB_USER
              value: complaint_app
            - name: DB_PASSWORD
              value: complaint123
            - name: SECRET_KEY
              value: change-this-secret-later

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: complaint-management
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000

