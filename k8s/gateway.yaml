apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: complaint-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: complaint-management
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: complaint-management
data:
  nginx.conf: |
    events {}

    http {

        upstream auth_service {
            server auth-service:8000;
        }

        upstream user_service {
            server user-service:8000;
        }

        upstream complaint_service {
            server complaint-service:8000;
        }

        upstream assignment_service {
            server assignment-service:8000;
        }

        upstream notification_service {
            server notification-service:8000;
        }

        server {
            listen 80;

            location /auth/ {
                proxy_pass http://auth_service/;
            }

            location /users/ {
                proxy_pass http://user_service/;
            }

            location /complaints/ {
                proxy_pass http://complaint_service/;
            }

            location /assignments/ {
                proxy_pass http://assignment_service/;
            }

            location /notifications/ {
                proxy_pass http://notification_service/;
            }
        }
    }