input {
    tcp {
        port => 5000
        codec => json
    }
}

filter {
    if [service] {
        mutate {
            add_field => {
                "application" => "complaint-management"
            }
        }
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "complaint-management-logs-%{+YYYY.MM.dd}"
    }

    stdout {
        codec => rubydebug
    }
}