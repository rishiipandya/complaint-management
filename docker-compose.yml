services:

  postgres:
    image: postgres:16
    container_name: complaint-postgres
    environment:
      POSTGRES_DB: complaint_management
      POSTGRES_USER: complaint_app
      POSTGRES_PASSWORD: complaint123
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: complaint_management
      DB_USER: complaint_app
      DB_PASSWORD: complaint123
      SECRET_KEY: change-this-secret-later
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    depends_on:
      - postgres
      - logstash

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8001:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: complaint_management
      DB_USER: complaint_app
      DB_PASSWORD: complaint123
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    depends_on:
      - postgres
      - logstash

  complaint-service:
    build: ./complaint-service
    container_name: complaint-service
    ports:
      - "8002:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: complaint_management
      DB_USER: complaint_app
      DB_PASSWORD: complaint123
      SECRET_KEY: change-this-secret-later
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    depends_on:
      - postgres
      - logstash

  assignment-service:
    build: ./assignment-service
    container_name: assignment-service
    ports:
      - "8003:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: complaint_management
      DB_USER: complaint_app
      DB_PASSWORD: complaint123
      SECRET_KEY: change-this-secret-later
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    depends_on:
      - postgres
      - notification-service
      - logstash

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8004:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: complaint_management
      DB_USER: complaint_app
      DB_PASSWORD: complaint123
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    depends_on:
      - postgres
      - logstash

  api-gateway:
    image: nginx:alpine
    container_name: complaint-api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - complaint-service
      - assignment-service
      - notification-service

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: complaint-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: complaint-logstash
    environment:
      - LS_JAVA_OPTS=-Xms128m -Xmx128m
    ports:
      - "5000:5000"
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: complaint-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=256
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  postgres_data:
  elasticsearch_data: