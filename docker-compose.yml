services:

  postgres:
    image: postgres:16
    container_name: complaint-postgres
    environment:
      POSTGRES_DB: complaint_management
      POSTGRES_USER: complaint_app
      POSTGRES_PASSWORD: complaint123
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: complaint_management
      DB_USER: complaint_app
      DB_PASSWORD: complaint123
      SECRET_KEY: change-this-secret-later
    depends_on:
      - postgres

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8001:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: complaint_management
      DB_USER: complaint_app
      DB_PASSWORD: complaint123
    depends_on:
      - postgres

  complaint-service:
    build: ./complaint-service
    container_name: complaint-service
    ports:
      - "8002:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: complaint_management
      DB_USER: complaint_app
      DB_PASSWORD: complaint123
      SECRET_KEY: change-this-secret-later
    depends_on:
      - postgres

  assignment-service:
    build: ./assignment-service
    container_name: assignment-service
    ports:
      - "8003:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: complaint_management
      DB_USER: complaint_app
      DB_PASSWORD: complaint123
      SECRET_KEY: change-this-secret-later
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      - postgres
      - notification-service

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8004:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: complaint_management
      DB_USER: complaint_app
      DB_PASSWORD: complaint123
    depends_on:
      - postgres

  api-gateway:
    image: nginx:alpine
    container_name: complaint-api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - complaint-service
      - assignment-service
      - notification-service

volumes:
  postgres_data: